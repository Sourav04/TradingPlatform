[project]
name = "trading-platform"
version = "0.1.0"
description = "Offline-first Indian algorithmic trading simulation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0.40,<3",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["httpx", "mypy", "pytest", "ruff", "pip-audit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
