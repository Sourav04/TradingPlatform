name: Phase 1 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_simulation
          POSTGRES_USER: simulator
          POSTGRES_PASSWORD: ci-simulation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simulator -d test_simulation"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src tests
      - name: SQLite and offline tests
        run: uv run --locked pytest --junitxml=reports/sqlite.xml
      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://simulator:ci-simulation@localhost:5432/test_simulation
        run: uv run --locked pytest --junitxml=reports/postgres.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/*.xml

  scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - name: Audit locked runtime and development dependencies
        run: uv run --locked pip-audit --local --skip-editable
      - name: Scan Git history for secrets
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 git --redact /repo
